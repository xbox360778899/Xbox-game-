name: Build Xbox 360 XEX

on:
  push:
    branches: [ main ]
  workflow_dispatch: # इसे मैन्युअली भी चलाया जा सकता है

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build

    # ---------------------------------------------------------
    # CACHING: टूलचेन को बार-बार बिल्ड करने से बचाने के लिए (समय बचेगा)
    # ---------------------------------------------------------
    - name: Cache XSDK Toolchain
      id: cache-xsdk
      uses: actions/cache@v4
      with:
        path: |
          ~/xsdk-gcc
          ~/xsdk-gcc-work
        key: ${{ runner.os }}-xsdk-toolchain-v1

    # ---------------------------------------------------------
    # TOOLCHAIN SETUP: सिर्फ तभी बिल्ड होगा जब कैश न मिले
    # ---------------------------------------------------------
    - name: Build XSDK Toolchain
      if: steps.cache-xsdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/xenosworks/xsdk.git ~/xsdk
        cd ~/xsdk
        PREFIX=$HOME/xsdk-gcc WORK=$HOME/xsdk-gcc-work JOBS=$(nproc) tools/toolchain/build.sh

    # ---------------------------------------------------------
    # PROJECT BUILD: आपके प्रोजेक्ट को कंपाइल करके .xex बनाना
    # ---------------------------------------------------------
    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -G Ninja -DXSDK_TOOLCHAIN=$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-

    - name: Build Project
      run: |
        cd build
        ninja

    # ---------------------------------------------------------
    # ARTIFACT UPLOAD: बनी हुई .xex फ़ाइल को GitHub पर सेव करना
    # ---------------------------------------------------------
    - name: Upload XEX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xbox360-build
        path: build/**/*.xex
